services:
  postgres:
    image: postgres:16.1-alpine
    environment:
      POSTGRES_PASSWORD: taskqueue
      POSTGRES_USER: taskqueue
      POSTGRES_DB: taskqueue
      POSTGRES_MAX_CONNECTIONS: "300"  # 增加最大连接数
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: 
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=256MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskqueue"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      target: api
    environment:
      STORAGE_DRIVER: postgres
      BROKER_DRIVER: redis
      DATABASE_URL: postgres://taskqueue:taskqueue@postgres:5432/taskqueue?sslmode=disable&pool_max_conns=200
      REDIS_ADDR: redis:6379
      QUEUE_STREAM: job_stream
      CONSUMER_GROUP: workers
      ENABLE_RATE_LIMITER: "false"  # 压力测试时禁用，生产环境应启用
      RATE_LIMIT_PER_MINUTE: "10000"  # 如果启用，设置为高值
      JWT_SECRET: ""  # 留空以禁用 JWT 认证（仅用于开发环境）
      GOMAXPROCS: "4"  # 增加 Go 运行时可用的 CPU 核心数
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  worker:
    build:
      context: .
      target: worker
    environment:
      STORAGE_DRIVER: postgres
      BROKER_DRIVER: redis
      DATABASE_URL: postgres://taskqueue:taskqueue@postgres:5432/taskqueue?sslmode=disable
      REDIS_ADDR: redis:6379
      QUEUE_STREAM: job_stream
      CONSUMER_GROUP: workers
      WORKER_POOL_SIZE: 8
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8080/v1
    ports:
      - "3001:80"
    depends_on:
      - api

volumes:
  pgdata: {}

